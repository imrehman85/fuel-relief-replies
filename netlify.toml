# Static single-page site — nothing to build, publish the repo root.
[build]
  publish = "."
  command = ""

# The deployed URL is reachable by anyone who has it, even though the
# repository is private. Keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
